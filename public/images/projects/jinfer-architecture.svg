  <line x1="920" y1="450" x2="920" y2="530" stroke="#0a0a0a"/>

  <text x="162" y="130" font-size="16" font-family="monospace" fill="#0a0a0a">REST client</text>
  <text x="162" y="153" font-size="13" font-family="monospace" fill="#4a4a4a">POST /predict/{model} - inline score</text>
  <text x="702" y="130" font-size="16" font-family="monospace" fill="#0a0a0a">Async client</text>
  <text x="702" y="153" font-size="13" font-family="monospace" fill="#4a4a4a">POST /predict/async - 202 Accepted</text>

  <text x="162" y="266" font-size="16" font-family="monospace" fill="#0a0a0a">ApiKeyAuthFilter</text>
  <text x="162" y="289" font-size="13" font-family="monospace" fill="#4a4a4a">X-API-Key (SHA-256 hashed) - roles READ / PREDICT / ADMIN</text>

  <text x="162" y="400" font-size="16" font-family="monospace" fill="#0a0a0a">InferenceService</text>
  <text x="162" y="423" font-size="13" font-family="monospace" fill="#4a4a4a">one shared scoring path - persist, score, rationale, metrics</text>

  <text x="162" y="570" font-size="16" font-family="monospace" fill="#0a0a0a">ONNX Runtime</text>
  <text x="162" y="593" font-size="13" font-family="monospace" fill="#4a4a4a">in-JVM session</text>
  <text x="162" y="613" font-size="13" font-family="monospace" fill="#4a4a4a">no Python hop</text>

  <text x="482" y="570" font-size="16" font-family="monospace" fill="#0a0a0a">PostgreSQL 16</text>
  <text x="482" y="593" font-size="13" font-family="monospace" fill="#4a4a4a">Flyway migrations</text>
  <text x="482" y="613" font-size="13" font-family="monospace" fill="#4a4a4a">audit trail</text>

  <text x="802" y="570" font-size="16" font-family="monospace" fill="#0a0a0a">Kafka topics</text>
  <text x="802" y="593" font-size="13" font-family="monospace" fill="#4a4a4a">inference-requests</text>
  <text x="802" y="613" font-size="13" font-family="monospace" fill="#4a4a4a">inference-results</text>
