<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" fill="#ffffff"/>
  <rect x="40" y="40" width="1120" height="640" stroke="#0a0a0a"/>

  <rect x="140" y="90" width="380" height="90" fill="#fafafa" stroke="#0a0a0a"/>
  <rect x="680" y="90" width="380" height="90" fill="#fafafa" stroke="#0a0a0a"/>

  <rect x="140" y="235" width="920" height="70" fill="#f4f4f4" stroke="#0a0a0a"/>

  <rect x="140" y="360" width="920" height="90" fill="#fafafa" stroke="#0a0a0a"/>

  <rect x="140" y="530" width="280" height="100" fill="#fafafa" stroke="#0a0a0a"/>
  <rect x="460" y="530" width="280" height="100" fill="#fafafa" stroke="#0a0a0a"/>
  <rect x="780" y="530" width="280" height="100" fill="#fafafa" stroke="#0a0a0a"/>

  <line x1="330" y1="180" x2="330" y2="235" stroke="#0a0a0a"/>
  <line x1="870" y1="180" x2="870" y2="235" stroke="#0a0a0a"/>
  <line x1="600" y1="305" x2="600" y2="360" stroke="#0a0a0a"/>
  <line x1="280" y1="450" x2="280" y2="530" stroke="#0a0a0a"/>
